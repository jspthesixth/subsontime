services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subsontime
      POSTGRES_PASSWORD: subsontime
      POSTGRES_DB: subsontime
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsontime"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
