name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          SUBSONTIME_FFMPEG: /usr/bin/ffmpeg

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --tag subsontime .
      - run: |
          docker run --detach --name subsontime --publish 7000:7000 \
            --env "SECRET=$(openssl rand -hex 32)" --env "INSTALL_SALT=$(openssl rand -hex 32)" subsontime

          for _ in $(seq 30); do
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:7000/health)" = 200 ]; then
              exit 0
            fi

            sleep 1
          done

          docker logs subsontime
          echo "::error::The image did not answer 200 on /health within 30 seconds"
          exit 1
