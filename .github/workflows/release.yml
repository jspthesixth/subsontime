name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  alpineNode: node:24.14.0-alpine@sha256:7fddd9ddeae8196abf4a3ef2de34e11f7b1a722119f91f28ddf1e99dcafdf114
  dotnetSDK: mcr.microsoft.com/dotnet/sdk:10.0.404@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
  yq: mikefarah/yq:4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(jq -r .version package.json)

          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, name: subsontime-linux-x64 }
          - { runner: ubuntu-24.04-arm, name: subsontime-linux-arm64 }
          - { runner: ubuntu-24.04, name: subsontime-linux-musl-x64, musl: linux/amd64 }
          - { runner: ubuntu-24.04-arm, name: subsontime-linux-musl-arm64, musl: linux/arm64 }
          - { runner: macos-15-intel, name: subsontime-macos-x64 }
          - { runner: macos-15, name: subsontime-macos-arm64 }
          - { runner: windows-2025, name: subsontime-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile

      - if: ${{ !matrix.musl }}
        run: |
          pnpm build:cli --out "dist/${{ matrix.name }}"
          "dist/${{ matrix.name }}" --version

      - if: ${{ matrix.musl }}
        run: |
          docker create --name alpine-node --platform "${{ matrix.musl }}" "$alpineNode"
          docker cp alpine-node:/usr/local/bin/node node-musl
          pnpm build:cli --node node-musl --out "dist/${{ matrix.name }}"
          docker run --rm --platform "${{ matrix.musl }}" --volume "$PWD/dist:/dist" "$alpineNode" "/dist/${{ matrix.name }}" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  jellyfin:
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          if [[ ! "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH, so it has no four-part Jellyfin version"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}.0"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          changelog="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"

          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --volume "$PWD:/repo" --workdir /repo "$dotnetSDK" \
            dotnet publish plugins/jellyfin/Jellyfin.Plugin.SubsOnTime.csproj --configuration Release --output dist/jellyfin "-p:Version=$version"
          docker run --rm --interactive --env "version=$version" --env "timestamp=$timestamp" --env "changelog=$changelog" "$yq" --output-format json \
            'del(.framework, .artifacts) | .version = strenv(version) | .timestamp = strenv(timestamp) | .changelog = strenv(changelog)' \
            < plugins/jellyfin/build.yaml > dist/jellyfin/meta.json
          mapfile -t artifacts < <(docker run --rm --interactive "$yq" '.artifacts[]' < plugins/jellyfin/build.yaml)
          (cd dist/jellyfin && zip "../subsontime-jellyfin_$version.zip" meta.json "${artifacts[@]}")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subsontime-jellyfin
          path: dist/subsontime-jellyfin_*.zip
          if-no-files-found: error

  bazarr-plus:
    needs: tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - working-directory: plugins/bazarr-plus
        run: |
          mkdir -p ../../dist
          zip ../../dist/subsontime-bazarr-plus.zip provider.json provider.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subsontime-bazarr-plus
          path: dist/subsontime-bazarr-plus.zip
          if-no-files-found: error

  release:
    needs: [build, jellyfin, bazarr-plus]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum subsontime-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes subsontime-* SHA256SUMS

  image:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/jspthesixth/subsontime
          tags: type=semver,pattern={{version}}
          labels: org.opencontainers.image.licenses=GPL-3.0-or-later
          annotations: org.opencontainers.image.licenses=GPL-3.0-or-later
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

  jellyfin-repository:
    needs: release
    runs-on: ubuntu-24.04
    concurrency:
      group: jellyfin-repository
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: subsontime-jellyfin
          path: release
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile
      - run: |
          version="${GITHUB_REF_NAME#v}.0"
          zip="subsontime-jellyfin_$version.zip"
          checksum=$(md5sum "release/$zip" | cut -d " " -f 1)
          sourceUrl="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip"
          entry=$(unzip -p "release/$zip" meta.json | jq --arg checksum "$checksum" --arg sourceUrl "$sourceUrl" \
            '{version, changelog, targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp}')
          jq --argjson entry "$entry" 'map(select(.version != $entry.version)) + [$entry]' plugins/jellyfin/releases.json > release/releases.json
          mv release/releases.json plugins/jellyfin/releases.json

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit --message "Release the Jellyfin plugin $version" plugins/jellyfin/releases.json
          git pull --rebase
          node --experimental-strip-types scripts/check-jellyfin-releases.ts
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$DEFAULT_BRANCH"
