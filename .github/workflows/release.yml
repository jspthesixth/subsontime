name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  alpineNode: node:24.14.0-alpine@sha256:7fddd9ddeae8196abf4a3ef2de34e11f7b1a722119f91f28ddf1e99dcafdf114

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          version=$(jq -r .version package.json)

          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, name: subsontime-linux-x64 }
          - { runner: ubuntu-24.04-arm, name: subsontime-linux-arm64 }
          - { runner: ubuntu-24.04, name: subsontime-linux-musl-x64, musl: linux/amd64 }
          - { runner: ubuntu-24.04-arm, name: subsontime-linux-musl-arm64, musl: linux/arm64 }
          - { runner: macos-15-intel, name: subsontime-macos-x64 }
          - { runner: macos-15, name: subsontime-macos-arm64 }
          - { runner: windows-2025, name: subsontime-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile

      - if: ${{ !matrix.musl }}
        run: |
          pnpm build:cli --out "dist/${{ matrix.name }}"
          "dist/${{ matrix.name }}" --version

      - if: ${{ matrix.musl }}
        run: |
          docker create --name alpine-node --platform "${{ matrix.musl }}" "$alpineNode"
          docker cp alpine-node:/usr/local/bin/node node-musl
          pnpm build:cli --node node-musl --out "dist/${{ matrix.name }}"
          docker run --rm --platform "${{ matrix.musl }}" --volume "$PWD/dist:/dist" "$alpineNode" "/dist/${{ matrix.name }}" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum subsontime-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes subsontime-* SHA256SUMS
